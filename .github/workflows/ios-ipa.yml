name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach builds to a GitHub Release on tags

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          command -v pod >/dev/null || sudo gem install cocoapods --no-document
          xcodebuild -version

      - name: Bundle Capacitor JS core (lets the game call native plugins)
        run: cp node_modules/@capacitor/core/dist/capacitor.js www/lib/capacitor-core.js && ls -la www/lib/capacitor-core.js || echo "capacitor.js not found - the game falls back to the native bridge"

      - name: Create iOS project
        run: |
          npx cap add ios
          node scripts/patch-ios.mjs
          npx cap sync ios

      # Unsigned device build -> .ipa you can sideload with AltStore / Sideloadly / Xcode
      - name: Build unsigned IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p dist Payload
          cp -R build/device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry dist/StreetRacing3D-unsigned.ipa Payload

      # Simulator build -> drag App.app onto an iOS Simulator on any Mac with Xcode
      - name: Build for iOS Simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/App.app dist/StreetRacing3D-simulator.app.zip

      # Optional signed ad-hoc IPA (installs directly on registered iPhones). Add repository secrets:
      # IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID
      - name: Install signing certificate and profile
        if: env.IOS_CERTIFICATE_P12_BASE64 != ''
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build signed ad-hoc IPA
        if: env.IOS_CERTIFICATE_P12_BASE64 != ''
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE="$PROFILE_UUID"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :method string ad-hoc" -c "Add :teamID string $IOS_TEAM_ID" \
              -c "Add :signingStyle string manual" -c "Add :provisioningProfiles dict" \
              -c "Add :provisioningProfiles:com.streetracing3d.game string $PROFILE_UUID" \
              build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
          cp build/export/*.ipa dist/StreetRacing3D-adhoc.ipa

      - name: Upload iOS builds
        uses: actions/upload-artifact@v4
        with:
          name: StreetRacing3D-ios
          path: dist/*
          if-no-files-found: error

      - name: Attach iOS builds to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
