name: Publish web game (gh-pages)

# Copies www/ to the gh-pages branch on every push to main.
# GitHub Pages serves that branch at https://<user>.github.io/<repo>/
# (Settings -> Pages -> Source: Deploy from a branch -> gh-pages / root).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push www/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix www -b gh-pages-build
          git push -f origin gh-pages-build:gh-pages
